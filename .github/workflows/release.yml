name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - name: Build binary (embedding templates)
        shell: bash
        run: |
          deno compile -A \
            --target "${{ matrix.target }}" \
            --include .todo.md \
            --include .in-progress.md \
            --include .done.md \
            --output "dist/backlog-${{ matrix.suffix }}" \
            mod.ts
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/backlog-${{ matrix.suffix }}
